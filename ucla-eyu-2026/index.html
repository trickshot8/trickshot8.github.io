const PODS={"zh": {"src": "podcast-zh.mp3?v=48d59d69", "who": {"F": "小北", "M": "云健"}, "lines": [[0.3, "F", "欢迎收听周末小电台。我是小北。"], [3.37, "M", "我是云健。今天来聊一个适合全家一起去的科学活动：UCLA，加州大学洛杉矶分校的科学日。"], [12.3, "F", "十一月八日，星期天，是 UCLA 一年一次的科学日，名字叫 Exploring Your Universe，探索你的宇宙。中午十二点开始，下午五点结束，全部免费。"], [24.64, "M", "地点在校园里的科学广场，Court of Sciences。场地上会摆出八十六个互动展台，物理、化学、生物、地球、太空，什么都有。"], [35.27, "F", "这里没有一条固定的路线。展台太多了，不可能都看完。所以今天我们先把有哪些选择说清楚，到时候让小朋友自己挑。"], [45.06, "M", "第一种选择，也是最主要的：互动展台。这些展台都是大学里的研究人员和学生摆的，很多都能亲手做。"], [53.79, "F", "我们的建议是，不用每个都打卡。挑三到五个真正能动手的，玩透。看完一个展台，最好能说出来：我刚才做了什么，看到了什么。"], [63.87, "M", "第二种选择，天文馆。在数学科学楼的八楼，是一个圆顶的小剧场。灯一关，头顶就是满天星星，一场大概二十分钟。"], [73.12, "F", "天文馆要领票，先到先得。中午十二点发第一轮，是下午一点到三点半的场次；下午三点再发第二轮，是四点到五点半的场次。每人最多领五张，开场前十分钟要到。"], [86.13, "M", "有两点要提前知道。第一，里面全程是黑的，很小的小朋友可能会害怕。第二，婴儿车不能进去。带着小宝宝的话，可以分头行动：一个大人带大孩子进去，另一个在外面等。"], [99.87, "F", "第三种选择，看动画片，再问问题。PBS KIDS 会在现场放四场，不用领票。"], [106.9, "M", "下午一点是《动物狂欢节》，一部配着古典音乐的动画，片子的制片人会在现场回答大家的问题。"], [114.88, "F", "一点四十五和两点半，是两集《Weather Hunters》，天气猎人。一集在雨林，一集在沙漠，讲小朋友去解开奇怪天气的谜题。给角色配音的三位演员会来现场，和大家聊天。"], [128.07, "M", "三点一刻是《Ready Jet Go!》，两集讲去月球和火星的故事。这一场特别值得说一说：主持问答的是 Amy Mainzer，一位行星科学家，也是 UCLA 的教授。"], [141.58, "F", "她现在带领 NASA 的一个任务，叫近地天体勘测者，NEO Surveyor。这是一台太空望远镜，专门寻找可能靠近地球的小行星。"], [151.75, "M", "这台望远镜由 NASA 的喷气推进实验室，也就是帕萨迪纳的 JPL 负责研制。在科学日就能当面问到正在做行星防御的科学家，机会挺难得。"], [164.27, "F", "第四种选择，听讲座。那天有十几场半小时的科学讲座，大部分是给大孩子和大人听的，但有两场特别标明，适合幼儿园到二年级。"], [174.71, "M", "一场是一点半，题目叫《地球曾经是一片沸腾的岩浆海》。很久很久以前，刚形成不久的地球，表面全是滚烫的熔岩，后来才慢慢冷下来，变成今天有海洋、有陆地的样子。"], [188.47, "F", "另一场是两点一刻，讲夏威夷的天文学。夏威夷有很高的山，山顶空气稀薄，夜空特别暗，世界上很多大望远镜都建在那里。"], [198.26, "M", "不过讲座要坐半个小时。如果到时候小朋友正玩得开心，就别硬拉过去。还要注意，一点半的讲座和一点四十五的天气猎人，时间是重叠的，二选一就好。"], [210.69, "F", "第五种选择，到户外看会转的水。在 Moore Hall 外面的院子里，UCLA 的 SpinLab 团队会做旋转实验，每个整点开始，一次三四十分钟。"], [222.59, "M", "他们会让一盆水跟着桌子一起转。水一转起来，里面的颜色就会拧成漩涡。地球也在转，所以台风会打转，高空的风会绕着地球吹，就是这个道理。"], [234.26, "F", "还有几个，带小小孩的家庭可以先放一放。CNSI 的实验室参观，要满十二岁才能进。望远镜导览要爬梯子。植物园的寻宝挺好玩，但是离主会场远，婴儿车也进不去。"], [248.01, "M", "好，选择说完了。最后说几件实用的事。第一，十二点开始，人会很多。想去天文馆的话，最好十一点半左右到，让一个大人先去排队领票。"], [259.3, "F", "第二，现场有没有吃的不一定，最好出门前先吃饭，再带上水和零食。"], [265.04, "M", "第三，出发前看一下官网的停车说明。到了以后先看看现场的地图和指示牌，找到天文馆、讲座教室和放映的地方都在哪。"], [275.13, "F", "最后，给小朋友留三个小任务。第一，亲手做一个实验，回家讲给爸爸妈妈听：你做了什么，看到了什么。"], [283.43, "M", "第二，在旋转实验那里，找到水开始打转的那一刻，猜一猜它是往哪边转的。"], [289.9, "F", "第三，勇敢地问一位科学家一个问题。可以先用中文想好，再用英文问，比如：What are you studying? 你在研究什么？"], [298.68, "M", "科学日的展台，大多是正在做研究的学生和老师摆的。这一天，孩子可以离真正的科学问题很近。"], [306.95, "F", "祝你们玩得开心，我们科学日见。"]]}, "en": {"src": "podcast-en.mp3?v=c0734107", "who": {"F": "Maya", "M": "Leo"}, "lines": [[0.3, "F", "Welcome to Weekend Radio. I'm Maya."], [3.16, "M", "And I'm Leo. Today we're talking about a free science day the whole family can enjoy: Exploring Your Universe at UCLA."], [11.5, "F", "It's on Sunday, November eighth, from noon to five p.m., in the Court of Sciences on the UCLA campus. Everything is free."], [18.88, "M", "There will be eighty-six hands-on booths. Physics, chemistry, biology, Earth science, space. Pretty much all of it."], [26.25, "F", "There's no fixed route, and you can't possibly see everything. So let's walk through the options, and then let the kids choose."], [32.64, "M", "Option one, and the main event: the interactive booths. They're run by university researchers and students, and many of them let you try things yourself."], [42.07, "F", "Our tip: don't try to check off every booth. Pick three to five where kids can really get their hands busy, and go deep. After each one, see if your child can tell you what they did and what they noticed."], [52.55, "M", "Option two: the planetarium. It's on the eighth floor of the Mathematical Sciences Building. The lights go down, the dome fills with stars, and each show runs about twenty minutes."], [63.76, "F", "You need a ticket, and it's first come, first served. At noon they hand out tickets for shows from one to three thirty. At three, a second round covers shows from four to five thirty. Up to five tickets per person, and you need to arrive ten minutes before your show."], [77.82, "M", "Two things to know. It's completely dark inside, which can be scary for very young kids. And strollers can't go in. If you have a baby with you, split up: one adult takes the older kids in, the other waits outside."], [91.06, "F", "Option three: cartoons, plus a chance to ask questions. PBS KIDS is showing four free screenings, no tickets needed."], [98.66, "M", "At one o'clock, there's Carnival of the Animals, an animated film set to classical music, with a Q and A from the producer."], [106.69, "F", "At one forty-five and two thirty, there are two episodes of Weather Hunters, one in a rainforest and one in a desert, where kids solve strange weather mysteries. Three of the voice actors will be there in person."], [118.28, "M", "And at three fifteen, Ready Jet Go!, two episodes about going to the Moon and Mars. The Q and A is led by Amy Mainzer, a planetary scientist and UCLA professor."], [129.65, "F", "She leads a NASA mission called NEO Surveyor, a space telescope built to find asteroids that could come close to Earth."], [136.88, "M", "The telescope is being developed at NASA's Jet Propulsion Laboratory in Pasadena. Getting to ask a planetary defense scientist your questions in person? That's a rare chance."], [148.33, "F", "Option four: science talks. There are more than a dozen thirty-minute talks, mostly for older kids and adults. But two are marked for kindergarten through second grade."], [157.73, "M", "At one thirty: When Earth Was a Boiling Magma Ocean. Long, long ago, the young Earth was covered in hot molten rock. It slowly cooled into the planet of oceans and land we know today."], [169.17, "F", "At two fifteen: Astronomy in Hawaii. Hawaii has very tall mountains with thin air and dark skies, which is why so many of the world's big telescopes are built there."], [179.0, "M", "Just remember, a talk means sitting still for half an hour. If your kids are having a blast at the booths, don't drag them away. And the one thirty talk overlaps with the one forty-five Weather Hunters, so pick one."], [191.76, "F", "Option five: go outside and watch spinning water. In the courtyard outside Moore Hall, UCLA's SpinLab team runs rotating experiments. Each one starts on the hour and lasts thirty to forty minutes."], [203.11, "M", "They spin a tank of water on a turntable, and the colors inside twist into swirls. The Earth spins too, and that's why hurricanes rotate and high winds circle the globe."], [213.85, "F", "A few things families with little ones might skip. The CNSI lab tours are for ages twelve and up. The telescope tour involves climbing a ladder. And the botanical garden scavenger hunt is fun, but it's far from the main area, and strollers aren't allowed."], [227.65, "M", "Okay, a few practical tips. First, it gets busy right at noon. If you want planetarium tickets, aim to arrive around eleven thirty and send one adult to the ticket line."], [238.82, "F", "Second, food on site isn't guaranteed. Eat before you go, and bring water and snacks."], [244.04, "M", "Third, check the official parking page before you head out. When you arrive, look for the event map and signs to find the planetarium, the talk rooms, and the screenings."], [253.95, "F", "Finally, three little missions for the kids. Mission one: do an experiment yourself, then tell your family what you did and what you saw."], [261.51, "M", "Mission two: at the spinning water, watch for the moment the water starts to swirl, and guess which way it will turn."], [268.53, "F", "Mission three: be brave and ask a scientist a question. Something simple works great, like: What are you studying?"], [274.66, "M", "Most booths are run by people doing real research. For one afternoon, kids get to stand right next to real science."], [282.34, "F", "Have fun, and see you at science day!"]]}};

en:[['Hands-on booths','CORE · 12–5 PM','86 interactive booths across physics, chemistry, biology, Earth science and space.','Let kids choose experiments they can actually do. Depth beats a long checklist.',U.event],['Planetarium · about 20 min','LIMITED · paper tickets on site','Stars and planets on a dome, fun for the whole family; very young kids may not like the total darkness.','Ticket rounds at 12:00 and 3:00; Math Sciences 8th floor; arrive 10 minutes early; no strollers.',U.planet],['Magma ocean · talk for young kids','K–2 · 1:30–2:00','Pitched at kindergarten to second grade: what the young Earth looked like.','Room C (CS76). If the kids are happy at the booths, don\'t force it.',U.event],['Weather Hunters + voice-actor Q&A','PBS KIDS · 1:45 / 2:30','Two weather-mystery episodes, with three voice actors answering kids\' questions. Easier to sit through than a talk.','Free, no ticket. Rainforest at 1:45, desert at 2:30; pick one. Follow signs for the location.',U.pbs],['DIYnamics: spinning world','ON THE HOUR · 30–40 MIN','Watch a spinning tank of water outdoors and see why hurricanes and high winds swirl.','Moore Hall courtyard; free, no ticket. Confirm the session times on site.',U.spin],['Ready Jet Go! × Amy Mainzer','PBS KIDS · 3:15','Space cartoons plus Q&A with the scientist leading NASA\'s NEO Surveyor mission.','Free, no ticket. End time not posted; may clash with a late planetarium show.',U.pbs],['Telescope tours','OPTION · tickets on site','A rare look at a 14-inch telescope and rotating dome; meet on the 9th floor, and viewing involves a ladder.','Ask at the planetarium booth for times; arrive 5 minutes early. You decide whether a ladder suits your kid.',U.tele],['Botanical garden scavenger hunt','OPTION · closes 4:00','Kids\' scavenger hunt sheets, but far from the main area and no strollers.','Get a time-slot ticket at the Ticketed Events booth; enter where your ticket says; closes 4:00, no re-entry.',U.garden]]};
const SP={zh:[['PBS KIDS · 免费','13:00 动物狂欢节','《Carnival of the Animals》抢先放映 + 制片人问答；喜欢动物和音乐的孩子合适，偏观看。',U.pbs],['PBS KIDS · 免费','13:45 / 14:30 Weather Hunters','雨林篇、沙漠篇各一场，三位配音演员现场问答。',U.pbs],['讲座 · K–2','13:30 地球曾是岩浆海','CS76，30 分钟，官网标注 K–2。',U.event],['讲座 · K–2','14:15 夏威夷天文学','CS50，30 分钟，官网标注 K–2；这间教室有直播。',U.event],['PBS KIDS · 免费','15:15 Ready Jet Go!','月球、火星两集 + 行星科学家 Amy Mainzer 现场问答。',U.pbs],['户外演示 · 免费','整点 SpinLab 旋转科学','Moore Hall 外院，每个整点开始，约 30–40 分钟。',U.spin]],
en:[['PBS KIDS · free','1:00 Carnival of the Animals','Advance screening plus Q&A with the producer; good for kids who love animals and music, mostly watching.',U.pbs],['PBS KIDS · free','1:45 / 2:30 Weather Hunters','One rainforest and one desert episode, each with a live voice-actor Q&A.',U.pbs],['Talk · K–2','1:30 When Earth Was a Boiling Magma Ocean','CS76, 30 minutes, marked K–2 on the official schedule.',U.event],['Talk · K–2','2:15 Astronomy in Hawaii','CS50, 30 minutes, marked K–2; this room is livestreamed.',U.event],['PBS KIDS · free','3:15 Ready Jet Go!','Moon and Mars episodes plus Q&A with planetary scientist Amy Mainzer.',U.pbs],['Outdoor demo · free','On the hour: SpinLab','Moore Hall courtyard, starts every hour, about 30–40 minutes.',U.spin]]};
const PTS={zh:[['Court of Sciences · 主会场','活动 12:00–17:00；先找天文馆票亭，再自由逛展台。','UCLA+Court+of+Sciences'],['Math Sciences Building · 天文馆','天文馆在 8 楼；望远镜导览在 9 楼集合。','UCLA+Math+Sciences+Building'],['Moore Hall · SpinLab 户外演示','户外院子，整点开始，约 30–40 分钟。','Moore+Hall+UCLA']],en:[['Court of Sciences · main area','12–5 PM; find the planetarium booth first, then roam the booths.','UCLA+Court+of+Sciences'],['Math Sciences Building · planetarium','Planetarium on the 8th floor; telescope tours meet on the 9th.','UCLA+Math+Sciences+Building'],['Moore Hall · SpinLab demo','Outdoor courtyard, starts on the hour, about 30–40 minutes.','Moore+Hall+UCLA']]};
const ONSITE={zh:['票亭和展台位置问现场志愿者，或看当天的地图和指示牌。','植物园离主会场远，而且不能推婴儿车进去。','约好一个走散后的集合点，给孩子拍张当天的照片。'],en:['Ask volunteers or check the event map and signs for booth and ticket locations.','The botanical garden is far from the main area, and strollers aren\'t allowed.','Agree on a meeting spot in case you get separated, and snap a photo of your kids that morning.']};
const TODO={zh:[['rsvp','在 Eventbrite 免费 RSVP'],['traffic','出发前看实时路况'],['parking','看官网停车页：停哪、怎么付费'],['food','出门前吃饭；带水和零食'],['baby','带宝宝的话：奶瓶、尿布、湿巾、备用衣服'],['kids','好走的鞋、轻便外套、小背包'],['tix','约好谁去 12:00 排天文馆票（不想去就跳过）'],['meet','约好走散时的集合点'],['official','当天早上再看一眼官网有没有变化']],en:[['rsvp','RSVP for free on Eventbrite'],['traffic','Check live traffic before leaving'],['parking','Read the official parking page: where to park, how to pay'],['food','Eat before you go; pack water and snacks'],['baby','With a baby: bottles, diapers, wipes, spare clothes'],['kids','Comfy shoes, a light jacket, a small backpack'],['tix','Decide who queues for planetarium tickets at 12:00 (or skip)'],['meet','Pick a meeting spot in case you get separated'],['official','Check the official site again that morning']]};
const DEC={zh:[['11:30 到场后','要不要先冲天文馆？','想去就排 12:00 那轮；不想去就直接逛展台，别把排队时间花掉。'],['13:20 左右','讲座、放映，还是继续做实验？','孩子还在兴头上就继续逛展台；累了就去 K–2 讲座或 Weather Hunters 坐一会儿。'],['15:00 左右','要不要看 Ready Jet Go!？','喜欢太空动画、想听科学家问答就去；不然继续逛，早点离开。']],en:[['After arriving ~11:30','Go for planetarium tickets first?','If yes, join the 12:00 line. If not, head straight to the booths and don\'t burn time queuing.'],['Around 1:20','Talk, screening, or more experiments?','Still excited? Stay at the booths. Getting tired? Sit down for the K–2 talk or Weather Hunters.'],['Around 3:00','Catch Ready Jet Go!?','If they love space cartoons and want to hear a scientist, go. Otherwise keep exploring and leave early.']]};

let lang=store.get('lang',null)||((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en');
let mode=store.get('mode','explore');
const t=k=>T[lang][k];

function applyStatic(){
  document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  document.title=lang==='zh'?'UCLA 科学日 2026 · 指南':'UCLA Science Day 2026 · Guide';
  document.querySelectorAll('[data-t]').forEach(el=>{const v=t(el.dataset.t);if(v==null)return;if(el.dataset.html)el.innerHTML=v;else el.textContent=v;});
  document.querySelectorAll('[data-lang]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang?'true':'false'));
  $('podPlay').setAttribute('aria-label',t('pod_play'));
}
function renderTimeline(){
  $('modeExplain').textContent=t('ex_'+mode);
  document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode));
  let arr=MODES[mode].map(id=>({...TL[id],id}));
  const picks=store.get('picks',[]),have=new Set(arr.map(e=>SID[e.id]).filter(Boolean));
  SESS.filter(x=>picks.includes(x.id)&&!have.has(x.id)).forEach(x=>arr.push({t:x.s,type:'PICK',url:x.url,zh:[x.zh,x.s+'–'+x.e,sessLocZh(x)],en:[x.en,x.s+'–'+x.e,sessLocEn(x)]}));
  arr.sort((a,b)=>a.t.localeCompare(b.t));
  const got=$('gotPlanet').checked,pt=$('planetTime').value;
  if(got&&pt&&mode==='planet'){arr.push({t:pt,type:'TICKET',fixed:1,url:U.planet,zh:['已领票 · 天文馆场次','票面时间前至少 10 分钟到 Math Sciences 8 楼。放映约 20 分钟，婴儿车不能进。','Math Sciences · 8 楼'],en:['Ticketed · planetarium show','Be at Math Sciences, 8th floor, at least 10 minutes before. About 20 minutes; no strollers.','Math Sciences · 8th floor']});arr.sort((a,b)=>a.t.localeCompare(b.t));}
  const tg=t('tag');
  $('timeline').innerHTML=arr.map(e=>{const [ti,de,lo]=e[lang];const cls=e.type==='OFFICIAL'||e.type==='TICKET'?'':(e.type==='VERIFY'?'warn':(e.type==='PICK'?'blue':'neutral'));
    return `<div class="event ${e.fixed?'fixed':''}"><div class="evtime">${e.t}</div><div class="evdot"></div><div class="evbody"><div class="evhead"><div class="evtitle">${esc(ti)}</div><span class="pill ${cls}">${tg[e.type]}</span></div><div class="evdesc">${esc(de)}</div><div class="evfoot">${lo?`<span class="loc">📍 ${esc(lo)}</span>`:''}${e.url?`<a class="tiny" href="${e.url}" target="_blank" rel="noopener">${t('src_ref')}</a>`:''}</div></div></div>`}).join('');
  $('ticketTimeWrap').style.display=got?'block':'none';
  const hint=$('ticketHint');hint.style.display='none';
  if(got&&!pt){hint.textContent=t('tix_need_time');hint.style.display='block';}
  if(got&&pt){const m=+pt.slice(0,2)*60+ +pt.slice(3),w=[];if(m<780||m>1050)w.push(t('tix_range'));
    const a=m-10,b=m+20,F=[['talk',810,840],['wh1',825,870],['spin',840,880],['hawaii',855,885],['wh2',870,915],['rjg',915,970]];
    const nm={zh:{talk:'13:30 K–2 讲座',wh1:'13:45 Weather Hunters',spin:'14:00 SpinLab',hawaii:'14:15 夏威夷讲座',wh2:'14:30 Weather Hunters',rjg:'15:15 Ready Jet Go!'},en:{talk:'the 1:30 K–2 talk',wh1:'1:45 Weather Hunters',spin:'2:00 SpinLab',hawaii:'the 2:15 Hawaii talk',wh2:'2:30 Weather Hunters',rjg:'3:15 Ready Jet Go!'}}[lang];
    const hit=F.filter(f=>a<f[2]&&b>f[1]).map(f=>nm[f[0]]);if(hit.length)w.push(t('tix_conflict').replace('{x}',hit.join(lang==='zh'?'、':', ')));
    if(w.length){hint.textContent=w.join(' ');hint.style.display='block';}}
}
function renderLists(){
  $('famTips').innerHTML=FAM[lang].map(([h,p])=>`<div class="item"><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join('');
  $('activityCards').innerHTML=ACT[lang].map((a,i)=>`<div class="item"><span class="pill ${i<2?'':'neutral'}">${esc(a[1])}</span><h3>${esc(a[0])}</h3><p><b>${lang==='zh'?'为什么':'WHY'}</b> · ${esc(a[2])}</p><p><b>${lang==='zh'?'怎么做':'HOW'}</b> · ${esc(a[3])}</p><div class="actions"><a class="btn" href="${a[4]}" target="_blank" rel="noopener">${lang==='zh'?'官方详情 ↗':'Details ↗'}</a></div></div>`).join('');
  $('specials').innerHTML=SP[lang].map(s=>`<div class="mini"><span class="tag">${esc(s[0])}</span><h3>${esc(s[1])}</h3><p>${esc(s[2])}</p><a class="small" href="${s[3]}" target="_blank" rel="noopener">${t('src_ref')}</a></div>`).join('');
  $('points').innerHTML=PTS[lang].map((p,i)=>`<div class="map-point"><div class="n">${i+1}</div><div><b>${esc(p[0])}</b><p>${esc(p[1])}</p><a class="small" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${p[2]}">${lang==='zh'?'在地图上看 ↗':'Open in Maps ↗'}</a></div></div>`).join('');
  $('onsite').innerHTML=ONSITE[lang].map(s=>`<li>${esc(s)}</li>`).join('');
  $('decisions').innerHTML=DEC[lang].map(d=>`<div class="item"><span class="pill warn">${esc(d[0])}</span><h3>${esc(d[1])}</h3><p>${esc(d[2])}</p></div>`).join('');
  renderChecklist();
}
function renderChecklist(){const v=store.get('checks',{});const L=TODO[lang];
  $('checklist').innerHTML=L.map(([id,l])=>`<label class="check ${v[id]?'done':''}"><input type="checkbox" data-check="${id}" ${v[id]?'checked':''}><span class="check-text">${esc(l)}</span></label>`).join('');
  const n=L.filter(x=>v[x[0]]).length;$('progressText').textContent=`${n} / ${L.length} ${t('done')}`;$('progressFill').style.width=(n/L.length*100)+'%';
  document.querySelectorAll('[data-check]').forEach(x=>x.addEventListener('change',()=>{const w=store.get('checks',{});w[x.dataset.check]=x.checked;store.set('checks',w);renderChecklist()}));}

// ---- podcast ----
const aud=$('podAud'),tx=$('podTx'),seek=$('podSeek');let act=-1,seeking=false,els=[];
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function loadPod(){const P=PODS[lang];aud.pause();aud.src=P.src;$('podErr').hidden=true;$('podCur').textContent='0:00';$('podTot').textContent='--:--';seek.value=0;act=-1;tx.innerHTML='';
  els=P.lines.map(l=>{const b=document.createElement('button');b.type='button';b.className='ln '+l[1];const w=document.createElement('b');w.textContent=P.who[l[1]];const s=document.createElement('span');s.textContent=l[2];b.append(w,s);b.onclick=()=>{aud.currentTime=l[0]+0.01;aud.play().catch(()=>{$('podErr').hidden=false})};tx.append(b);return b});
  aud.playbackRate=+(document.querySelector('.pod .rate[aria-pressed=true]')?.dataset.rate||1);}
const mark=s=>{const L=PODS[lang].lines;let i=-1;for(let j=0;j<L.length;j++){if(L[j][0]<=s)i=j;else break}if(i!==act){els[act]?.classList.remove('on');act=i;if(els[i]){els[i].classList.add('on');if(!aud.paused)tx.scrollTop=els[i].offsetTop-tx.offsetTop-50}}};
aud.addEventListener('play',()=>{$('podIco').setAttribute('d','M7 5h4v14H7zM13 5h4v14h-4z');$('podPlay').setAttribute('aria-label',t('pod_pause'))});
aud.addEventListener('pause',()=>{$('podIco').setAttribute('d','M8 5v14l11-7z');$('podPlay').setAttribute('aria-label',t('pod_play'))});
aud.addEventListener('loadedmetadata',()=>{$('podTot').textContent=fmt(aud.duration);seek.max=aud.duration});
aud.addEventListener('timeupdate',()=>{$('podCur').textContent=fmt(aud.currentTime);if(!seeking)seek.value=aud.currentTime;mark(aud.currentTime)});
aud.addEventListener('error',()=>{if(aud.src)$('podErr').hidden=false});
seek.addEventListener('input',()=>{seeking=true;$('podCur').textContent=fmt(+seek.value)});seek.addEventListener('change',()=>{aud.currentTime=+seek.value;seeking=false});
$('podPlay').addEventListener('click',()=>{if(aud.paused)aud.play().catch(()=>{$('podErr').hidden=false});else aud.pause()});
document.querySelectorAll('.pod .rate').forEach(c=>c.addEventListener('click',()=>{aud.playbackRate=+c.dataset.rate;document.querySelectorAll('.pod .rate').forEach(x=>x.setAttribute('aria-pressed',x===c?'true':'false'))}));

// ---- wiring ----
function setLang(l){lang=l;store.set('lang',l);applyStatic();renderTimeline();renderLists();renderPicker();loadPod();}
document.querySelectorAll('#pkFilter [data-f]').forEach(b=>b.addEventListener('click',()=>{pkFilter=b.dataset.f;renderPicker()}));
document.querySelectorAll('[data-lang]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.lang!==lang)setLang(b.dataset.lang)}));
function switchTab(id){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===id));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.id===id));window.scrollTo({top:document.querySelector('nav').offsetTop-3,behavior:'smooth'});}
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.mode;store.set('mode',mode);renderTimeline()}));
$('gotPlanet').checked=store.get('gotPlanet',false);$('planetTime').value=store.get('planetTime','');
$('gotPlanet').addEventListener('change',()=>{store.set('gotPlanet',$('gotPlanet').checked);renderTimeline();renderPicker()});
$('planetTime').addEventListener('change',()=>{store.set('planetTime',$('planetTime').value);renderTimeline();renderPicker()});
$('resetChecks').addEventListener('click',()=>{if(confirm(t('reset_q'))){store.set('checks',{});renderChecklist()}});
$('copyPlan').addEventListener('click',async()=>{const v=t('copy_head')+t('copy_mode')[mode]+t('copy_tail');try{await navigator.clipboard.writeText(v);$('copyPlan').textContent=t('copied');setTimeout(()=>$('copyPlan').textContent=t('btn_copy'),1800)}catch{prompt('',v)}});
$('downloadICS').addEventListener('click',()=>{const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const ev=(uid,a,b,sum,loc,desc,al)=>['BEGIN:VEVENT','UID:'+uid+'@eyu-guide','DTSTAMP:'+st,'DTSTART:'+a,'DTEND:'+b,'SUMMARY:'+sum,'LOCATION:'+loc,'DESCRIPTION:'+desc,'URL:https://exploringyouruniverse.ucla.edu/','BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+sum,'TRIGGER:-PT'+al+'M','END:VALARM','END:VEVENT'];
  const txt=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//EYU Field Guide//2026//EN',...ev('eyu2026-tix','20261108T200000Z','20261108T201500Z',t('ics_tix'),'Planetarium booth\\, UCLA Court of Sciences',t('ics_tix_d'),30),...ev('eyu2026-day','20261108T200000Z','20261109T010000Z',t('ics_sum'),'UCLA Court of Sciences\\, Los Angeles\\, CA',t('ics_d'),90),...SESS.filter(x=>store.get('picks',[]).includes(x.id)).flatMap(x=>{const z=v=>{const m=mins(v)+480;return '20261108T'+String(Math.floor(m/60)).padStart(2,'0')+String(m%60).padStart(2,'0')+'00Z'};return ev('eyu2026-'+x.id,z(x.s),z(x.e),sessName(x),(x.room?ROOM[x.room]:sessLoc(x)).replace(/,/g,'\\,')+'\\, UCLA',x.en,10)}),'END:VCALENDAR',''].join('\r\n');
  const u=URL.createObjectURL(new Blob([txt],{type:'text/calendar;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='UCLA-EYU-2026.ics';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)});
setLang(lang);
})();
</script>
